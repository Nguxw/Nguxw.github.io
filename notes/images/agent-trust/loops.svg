<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">内循环与外循环</title>
  <desc id="d">外循环在每次发布新版本后启动：对整个应用做模糊测试，为发现的每个缺陷提交修复 PR，并自动合并。每个修复 PR 都要经过内循环：代码与 API 约束、静态分析、运行时验证与证据。只有内循环可靠，外循环的自动合并才成立。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b9994"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff5a1f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8fe3b8"/></marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 16px; font-weight: 600; }
    .box { fill: #151517; stroke: #ffffff2e; }
    .line { stroke: #9b9994; stroke-width: 1.4; fill: none; }
    .hi { fill: none; stroke: #ff5a1f; stroke-width: 1.6; opacity: 0; }
    @keyframes dash9 { to { stroke-dashoffset: -18; } }
    .flow9 { animation: dash9 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .flow9 { animation: none; } }
  </style>
  <rect width="960" height="540" fill="#0e0e10"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.3</text>
  <text x="84" y="40" class="s">外循环建立在内循环之上</text>

  <text x="32" y="84" class="xs mono" letter-spacing="1" style="fill:#ff5a1f">外循环 · 每次发布后自动运行</text>
  <rect class="box" x="32" y="98" width="200" height="64" rx="6" style="stroke:#ff5a1f88"/>
  <text x="48" y="126" class="b">发布新版本</text>
  <text x="48" y="148" class="s">稳定版约每天一个</text>
  <rect class="box" x="264" y="98" width="200" height="64" rx="6" style="stroke:#ff5a1f88"/>
  <text x="280" y="126" class="b">模糊测试</text>
  <text x="280" y="148" class="s">像真实用户一样使用应用</text>
  <rect class="box" x="496" y="98" width="200" height="64" rx="6" style="stroke:#ff5a1f88"/>
  <text x="512" y="126" class="b">修复 PR</text>
  <text x="512" y="148" class="s">每个缺陷一个</text>
  <rect class="box" x="728" y="98" width="200" height="64" rx="6" style="stroke:#ff5a1f88"/>
  <text x="744" y="126" class="b">自动合并</text>
  <text x="744" y="148" class="s">无需深入的人工审查</text>
  <path class="line" d="M232 130 H 262" marker-end="url(#a)"/>
  <path class="line" d="M464 130 H 494" marker-end="url(#a)"/>

  <path id="down" class="flow9" d="M596 162 V 214 H 212 V 270" stroke="#ff5a1f" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ao)"/>
  <text x="300" y="206" class="s" style="fill:#ff5a1f">每个修复 PR 都进入内循环</text>

  <text x="32" y="262" class="xs mono" letter-spacing="1" style="fill:#8fe3b8">内循环 · 每个改动都经过</text>
  <rect class="box" x="32" y="276" width="200" height="64" rx="6" style="stroke:#8fe3b899"/>
  <text x="48" y="304" class="b">代码与 API</text>
  <text x="48" y="326" class="s">错误的写法无处可写</text>
  <rect class="box" x="264" y="276" width="200" height="64" rx="6" style="stroke:#8fe3b899"/>
  <text x="280" y="304" class="b">静态分析</text>
  <text x="280" y="326" class="s">lint · 类型 · 依赖图</text>
  <rect class="box" x="496" y="276" width="200" height="64" rx="6" style="stroke:#8fe3b899"/>
  <text x="512" y="304" class="b">运行时验证</text>
  <text x="512" y="326" class="s">驱动真实的应用</text>
  <rect class="box" x="728" y="276" width="200" height="64" rx="6" style="stroke:#8fe3b899"/>
  <text x="744" y="304" class="b">证据</text>
  <text x="744" y="326" class="s">视频 · 截图 · 状态图</text>
  <path class="line" d="M232 308 H 262" marker-end="url(#a)"/>
  <path class="line" d="M464 308 H 494" marker-end="url(#a)"/>
  <path class="line" d="M696 308 H 726" marker-end="url(#a)"/>

  <path id="up" d="M828 276 V 168" stroke="#8fe3b8" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="840" y="226" class="s" style="fill:#8fe3b8">通过后</text>

  <path d="M32 388 H 928" stroke="#ffffff1a"/>
  <text x="32" y="418" class="s">内循环产出劣质代码时，把它自动化只会产出更多劣质代码，还要消耗越来越多的 token。</text>
  <text x="32" y="442" class="s">外循环敢于自动合并，前提是常见的错误已经被设计排除、被检查拒绝，或被验证暴露在合并之前。</text>
  <text x="32" y="466" class="s">扩大并行之前，先让单个任务的结果稳定可信。</text>
  <text x="32" y="512" class="xs">依据演讲整理，外循环的具体流程以讲者描述为准。</text>

  <g class="motion">
    <rect class="hi" x="32" y="98" width="200" height="64" rx="6"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.08;0.11;1"/></rect>
    <rect class="hi" x="264" y="98" width="200" height="64" rx="6"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.12;0.18;0.21;1"/></rect>
    <rect class="hi" x="496" y="98" width="200" height="64" rx="6"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.28;0.31;1"/></rect>
    <circle r="3.4" fill="#ff5a1f" opacity="0" filter="url(#glow)"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.29;0.4;1"><mpath href="#down"/></animateMotion><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.29;0.295;0.4;0.41;1"/></circle>
    <rect class="hi" x="32" y="276" width="200" height="64" rx="6" style="stroke:#8fe3b8"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.48;0.51;1"/></rect>
    <rect class="hi" x="264" y="276" width="200" height="64" rx="6" style="stroke:#8fe3b8"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.58;0.61;1"/></rect>
    <rect class="hi" x="496" y="276" width="200" height="64" rx="6" style="stroke:#8fe3b8"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.68;0.71;1"/></rect>
    <rect class="hi" x="728" y="276" width="200" height="64" rx="6" style="stroke:#8fe3b8"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7;0.72;0.78;0.81;1"/></rect>
    <circle r="3.4" fill="#8fe3b8" opacity="0" filter="url(#glow)"><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8;0.86;1"><mpath href="#up"/></animateMotion><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8;0.805;0.86;0.87;1"/></circle>
    <rect class="hi" x="728" y="98" width="200" height="64" rx="6" style="stroke:#8fe3b8"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.86;0.88;0.96;0.99;1"/></rect>
  </g>
</svg>
