<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">项目内验证 Skill 的组成</title>
  <desc id="d">验证 Skill 依次经过启动、诊断、驱动、证据与清理。功能地图把用户口中的“左侧边栏里那个东西”对应到具体的操作路径，供驱动步骤使用。证据记录操作、操作后的状态与副作用，在清理之后仍然保留，交给审查者查看。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b9994"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8fe3b8"/></marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 16px; font-weight: 600; }
    .box { fill: #151517; stroke: #ffffff2e; }
    .line { stroke: #9b9994; stroke-width: 1.4; fill: none; }
    .hi { fill: none; stroke: #ff5a1f; stroke-width: 1.6; opacity: 0; }
    @keyframes dash9 { to { stroke-dashoffset: -18; } }
    .flow9 { animation: dash9 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .flow9 { animation: none; } }
  </style>
  <rect width="960" height="540" fill="#0e0e10"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.2</text>
  <text x="84" y="40" class="s">让 Agent 像用户一样操作真实的应用，并留下证据</text>

  <text x="32" y="122" class="s">用户说：</text>
  <text x="32" y="146" class="b">“左侧边栏里那个东西”</text>
  <path id="m1" class="flow9" d="M224 140 H 380" stroke="#9b9994" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <rect class="box" x="388" y="104" width="156" height="64" rx="6" style="stroke:#8fe3b899"/>
  <text x="404" y="132" class="b">功能地图</text>
  <text x="404" y="154" class="s">用户视角的功能清单</text>
  <text x="564" y="124" class="s">每个功能一页：怎样到达、</text>
  <text x="564" y="144" class="s">怎样驱动、什么状态算成功</text>
  <path id="m2" d="M466 168 V 244" stroke="#8fe3b8" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>

  <text x="32" y="236" class="xs mono" letter-spacing="1">项目内的验证 SKILL</text>
  <rect class="box" x="32" y="250" width="156" height="64" rx="6"/>
  <text x="48" y="278" class="b">启动</text>
  <text x="48" y="300" class="s">从空数据目录到可用</text>
  <rect class="box" x="210" y="250" width="156" height="64" rx="6"/>
  <text x="226" y="278" class="b">诊断</text>
  <text x="226" y="300" class="s">只读确认实例可用</text>
  <rect class="box" x="388" y="250" width="156" height="64" rx="6"/>
  <text x="404" y="278" class="b">驱动</text>
  <text x="404" y="300" class="s">走真实的用户路径</text>
  <rect class="box" x="566" y="250" width="156" height="64" rx="6"/>
  <text x="582" y="278" class="b">证据</text>
  <text x="582" y="300" class="s">操作 · 状态 · 副作用</text>
  <rect class="box" x="744" y="250" width="156" height="64" rx="6"/>
  <text x="760" y="278" class="b">清理</text>
  <text x="760" y="300" class="s">删实例，留证据</text>
  <path class="line" d="M188 282 H 208" marker-end="url(#a)"/>
  <path class="line" d="M366 282 H 386" marker-end="url(#a)"/>
  <path class="line" d="M544 282 H 564" marker-end="url(#a)"/>
  <path class="line" d="M722 282 H 742" marker-end="url(#a)"/>

  <path id="m3" d="M644 314 V 380" stroke="#8fe3b8" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <rect class="box" x="566" y="388" width="334" height="40" rx="6" style="stroke:#8fe3b899"/>
  <text x="582" y="413" class="s" style="fill:#edece8">审查者查看：视频 · 截图 · 状态图</text>
  <text x="32" y="404" class="s">交付之前，生成的 Skill 要按自己的步骤完整运行一次；</text>
  <text x="32" y="424" class="s">从未执行过的 Skill 只能算草稿。</text>

  <path d="M32 452 H 928" stroke="#ffffff1a"/>
  <text x="32" y="480" class="s">证明的标准：走真实的用户路径，不调用内部 setter 或测试专用接口；记录操作与操作后的状态，并检查写入的文件、数据与消息。</text>
  <text x="32" y="512" class="xs">依据 pstack 的 create-verification-skill 与演讲内容整理。</text>

  <g class="motion">
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.1;1"><mpath href="#m1"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.02;0.025;0.1;0.11;1"/></circle>
    <rect class="hi" x="388" y="104" width="156" height="64" rx="6" style="stroke:#8fe3b8"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.12;0.5;0.53;1"/></rect>
    <rect class="hi" x="32" y="250" width="156" height="64" rx="6"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.14;0.16;0.24;0.27;1"/></rect>
    <rect class="hi" x="210" y="250" width="156" height="64" rx="6"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.26;0.28;0.36;0.39;1"/></rect>
    <circle r="3.2" fill="#8fe3b8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.38;1"><mpath href="#m2"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3;0.305;0.38;0.39;1"/></circle>
    <rect class="hi" x="388" y="250" width="156" height="64" rx="6"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.38;0.4;0.5;0.53;1"/></rect>
    <rect class="hi" x="566" y="250" width="156" height="64" rx="6"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.64;0.67;1"/></rect>
    <circle r="3.2" fill="#8fe3b8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.62;0.7;1"><mpath href="#m3"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.62;0.625;0.7;0.71;1"/></circle>
    <rect class="hi" x="744" y="250" width="156" height="64" rx="6"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7;0.8;0.83;1"/></rect>
    <rect class="hi" x="566" y="388" width="334" height="40" rx="6" style="stroke:#8fe3b8"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7;0.72;0.95;0.98;1"/></rect>
  </g>
</svg>
