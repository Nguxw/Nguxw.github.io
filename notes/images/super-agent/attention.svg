  <text x="488.0" y="448" text-anchor="middle" class="s">第 4 小时</text>

  <text x="600" y="386" class="s">要改善的是验收效率：</text>
  <text x="600" y="410" class="s">交付物附上依据、完成标准写清楚、</text>
  <text x="600" y="434" class="s">重复检查自动化、减少低价值通知。</text>
  <text x="32" y="476" class="xs">示例数字，仅用于说明吞吐关系。</text>
