<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" aria-labelledby="t d">
  <title id="t">人的验收能力成为吞吐瓶颈</title>
  <desc id="d">系统每小时交付 20 项结果，每项需要 5 分钟人工检查，一个人每小时只能验收 12 项，待审队列每小时增加 8 项。</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern></defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 16px; font-weight: 600; }
  </style>
  <rect width="960" height="496" fill="#0e0e10"/>
  <rect width="960" height="496" fill="url(#grid)"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.2</text>
  <text x="84" y="40" class="s">执行可以并行，验收仍然排队</text>

  <text x="32" y="90" class="b">Agent 每小时交付 20 项</text>
  <text x="928" y="90" text-anchor="end" class="s">增加 Worker 只会让这一行更长</text>
  <text x="32" y="180" class="b">一个人每小时能验收 12 项</text>
  <text x="928" y="180" text-anchor="end" class="s">每项检查 5 分钟 → 60 ÷ 5 = 12</text>
