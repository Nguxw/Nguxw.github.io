<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">用任务对象确认当前事实</title>
  <desc id="d">上午决定方案 A，下午改为方案 B；Worker、Router 摘要和评审 Agent 各自持有不同版本。任务对象记录当前有效的决定，结果在接受或外部写入前先做版本检查。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b9994"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff5a1f"/></marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 16px; font-weight: 600; }
    .box { fill: #151517; stroke: #ffffff2e; }
    .line { stroke: #9b9994; stroke-width: 1.4; fill: none; }
    .tag { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
  </style>
  <rect width="960" height="560" fill="#0e0e10"/>
  <rect width="960" height="560" fill="url(#grid)"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.3</text>
  <text x="84" y="40" class="s">历史都在，目标却分叉了</text>

  <!-- Timeline of decisions -->
  <line x1="32" y1="96" x2="300" y2="96" stroke="#ffffff2e"/>
  <circle cx="96" cy="96" r="5" fill="#9b9994"/><text x="96" y="80" text-anchor="middle" class="xs">上午 · 聊天</text>
  <text x="96" y="122" text-anchor="middle" class="s">“采用方案 A”</text>
  <circle cx="252" cy="96" r="5" fill="#ff5a1f"/><text x="252" y="80" text-anchor="middle" class="xs">下午 · 代码评审</text>
  <text x="252" y="122" text-anchor="middle" class="s">“改为方案 B”</text>

  <!-- Three agents with diverging versions -->
  <text x="32" y="172" class="xs mono" letter-spacing="1">三个会话，各自的版本</text>
  <rect class="box" x="32" y="186" width="268" height="56" rx="6"/>
  <text x="48" y="211" class="b">Worker</text><text x="48" y="231" class="s">仍在按上午的要求执行</text>
  <rect x="244" y="202" width="40" height="24" rx="12" fill="#ffffff14"/><text x="264" y="219" text-anchor="middle" class="tag">A</text>
  <rect class="box" x="32" y="254" width="268" height="56" rx="6"/>
  <text x="48" y="279" class="b">Router 摘要</text><text x="48" y="299" class="s">已经写成下午的方案</text>
  <rect x="244" y="270" width="40" height="24" rx="12" fill="#ff5a1f33"/><text x="264" y="287" text-anchor="middle" class="tag" style="fill:#ff5a1f">B</text>
  <rect class="box" x="32" y="322" width="268" height="56" rx="6"/>
  <text x="48" y="347" class="b">评审 Agent</text><text x="48" y="367" class="s">读取了上午的文档</text>
  <rect x="244" y="338" width="40" height="24" rx="12" fill="#ffffff14"/><text x="264" y="355" text-anchor="middle" class="tag">A</text>
  <text x="32" y="404" class="s">检索更多聊天记录，并不能消除冲突</text>

  <path class="line" d="M300 214 C 330 214, 330 260, 356 260" marker-end="url(#a)"/>
  <path class="line" d="M300 282 H 356" marker-end="url(#a)"/>
  <path class="line" d="M300 350 C 330 350, 330 304, 356 304" marker-end="url(#a)"/>

  <!-- Task object -->
  <rect x="358" y="150" width="268" height="300" rx="8" fill="#151517" stroke="#ff5a1f"/>
  <text x="378" y="182" class="b">任务对象</text>
  <text x="606" y="182" text-anchor="end" class="xs mono">单一事实来源</text>
  <line x1="378" y1="196" x2="606" y2="196" stroke="#ffffff2e"/>
  <text x="378" y="224" class="s">目标</text><text x="460" y="224" font-size="14">修复登录超时</text>
  <text x="378" y="254" class="s">所属项目</text><text x="460" y="254" font-size="14">web-app</text>
  <text x="378" y="284" class="s">授权范围</text><text x="460" y="284" font-size="14">改代码、开 PR</text>
  <text x="378" y="314" class="s">当前版本</text><text x="460" y="314" font-size="14" font-weight="700" style="fill:#ff5a1f">v4 · 方案 B</text>
  <text x="378" y="344" class="s">执行状态</text><text x="460" y="344" font-size="14">进行中</text>
  <text x="378" y="374" class="s">交付物</text><text x="460" y="374" font-size="14">PR、测试记录</text>
  <line x1="378" y1="392" x2="606" y2="392" stroke="#ffffff2e" stroke-dasharray="3 3"/>
  <text x="378" y="416" class="xs">决定记录：B 替代 A · 由谁 · 何时</text>
  <text x="378" y="436" class="xs">关键状态可追溯到原始决定</text>

  <!-- Version check -->
  <rect class="box" x="672" y="150" width="256" height="64" rx="6"/>
  <text x="688" y="176" class="b">旧 Worker 交回结果</text><text x="688" y="198" class="s">基于 v3 · 方案 A</text>
  <path class="line" d="M800 214 V 244" marker-end="url(#a)"/>
  <rect x="672" y="246" width="256" height="64" rx="6" fill="#151517" stroke="#ff5a1f"/>
  <text x="688" y="272" class="b">接受 / 外部写入之前</text><text x="688" y="294" class="s">对照任务对象检查版本</text>
  <path d="M626 278 H 668" stroke="#ff5a1f" stroke-width="1.6" fill="none" marker-end="url(#ao)"/>
  <path class="line" d="M800 310 V 340" marker-end="url(#a)"/>
  <rect class="box" x="672" y="342" width="256" height="108" rx="6"/>
  <text x="688" y="368" class="b" style="fill:#ffb547">v3 ≠ v4：标记为过期</text>
  <text x="688" y="392" class="s">版本检查能挡住覆盖写入，</text>
  <text x="688" y="414" class="s">但旧结果是否仍有参考价值，</text>
  <text x="688" y="436" class="s">仍然需要语义判断。</text>

  <text x="32" y="500" class="s">确定性约束（状态机、事务、版本控制）与模型判断，需要一起设计。</text>
  <text x="32" y="530" class="xs">场景为示意，任务字段是我认为的最小集合，并非原型中的数据结构。</text>
</svg>
