<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">从输入到外部动作的授权链</title>
  <desc id="d">消息和引用文档只是输入，不能改变权限；宿主程序执行准入名单、规则与任务授权；具体工具操作的权限需要另外检查。主动候选默认处于 observe 模式，只评估和记录，团队审查后再切换为自动接受。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b9994"/></marker>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 15px; font-weight: 600; }
    .box { fill: #151517; stroke: #ffffff2e; }
    .line { stroke: #9b9994; stroke-width: 1.4; fill: none; }

    @keyframes dash9 { to { stroke-dashoffset: -18; } }
    @keyframes dash7 { to { stroke-dashoffset: -14; } }
    .flow9 { animation: dash9 1.2s linear infinite; }
    .flow7 { animation: dash7 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .flow9, .flow7 { animation: none; } }
  </style>
  <rect width="960" height="500" fill="#0e0e10"/>
  <rect width="960" height="500" fill="url(#grid)"/>
  <g class="motion"><rect x="772" y="96" width="156" height="104" rx="6" fill="#ff5a1f" filter="url(#halo)" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.6;0.6;0;0" keyTimes="0;0.35;0.365;0.465;0.48;1"/></rect></g>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.4</text>
  <text x="84" y="40" class="s">职责分工不等于权限隔离</text>

  <!-- Coverage brackets -->
  <path d="M212 84 V 74 H 572 V 84" stroke="#8fe3b8" fill="none"/>
  <text x="392" y="66" text-anchor="middle" class="s" style="fill:#8fe3b8">原型的授权文档覆盖这一段</text>
  <path d="M592 84 V 74 H 928 V 84" stroke="#ffb547" fill="none"/>
  <text x="760" y="66" text-anchor="middle" class="s" style="fill:#ffb547">需要在工具层另外保证</text>

  <!-- Main chain -->
  <rect x="32" y="96" width="160" height="104" rx="6" fill="none" stroke="#ffffff2e" stroke-dasharray="4 3"/>
  <text x="48" y="124" class="b">输入</text>
  <text x="48" y="148" class="s">消息、评论、</text>
  <text x="48" y="168" class="s">引用的文档</text>
  <text x="48" y="188" class="xs">只是决策依据</text>
  <path class="line" d="M192 148 H 210" marker-end="url(#a)"/>

  <rect class="box" x="212" y="96" width="170" height="104" rx="6"/>
  <text x="228" y="124" class="b">准入</text>
  <text x="228" y="148" class="s">允许名单：谁能提要求</text>
  <text x="228" y="168" class="s">规则：何时可以主动</text>
  <path class="line" d="M382 148 H 400" marker-end="url(#a)"/>

  <rect class="box" x="402" y="96" width="170" height="104" rx="6"/>
  <text x="418" y="124" class="b">任务授权</text>
  <text x="418" y="148" class="s">Mandate 绑定到任务</text>
  <text x="418" y="168" class="s">范围随委派一起传递</text>
  <path class="line" d="M572 148 H 590" marker-end="url(#a)"/>

  <rect class="box" x="592" y="96" width="160" height="104" rx="6" style="stroke:#ffb54788"/>
  <text x="608" y="124" class="b">执行时检查</text>
  <text x="608" y="148" class="s">每个工具动作是否</text>
  <text x="608" y="168" class="s">落在授权范围内</text>
  <path class="line" d="M752 148 H 770" marker-end="url(#a)"/>

  <rect x="772" y="96" width="156" height="104" rx="6" fill="#ff5a1f"/>
  <text x="788" y="124" class="b" style="fill:#0b0b0c">外部动作</text>
  <text x="788" y="148" font-size="13" style="fill:#0b0b0cbb">合并、发布、</text>
  <text x="788" y="168" font-size="13" style="fill:#0b0b0cbb">对外发送消息</text>

  <!-- Injection path -->
  <path id="inject" d="M112 200 V 248 H 676 V 204" class="flow9" stroke="#ff6b6b" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="140" y="272" class="s" style="fill:#ff8a80">提示注入的风险路径：Router 不执行工具，仍可能把恶意内容转写成交给 Worker 的指令</text>

  <!-- Proactive path -->
  <text x="32" y="330" class="xs mono" letter-spacing="1">主动工作的放开顺序</text>
  <rect class="box" x="32" y="344" width="200" height="72" rx="6"/>
  <text x="48" y="372" class="b">推断出的主动候选</text>
  <text x="48" y="396" class="s">没人提要求，但规则匹配</text>
  <path class="line" id="p1" d="M232 380 H 262" marker-end="url(#a)"/>
  <rect class="box" x="264" y="344" width="210" height="72" rx="6"/>
  <text x="280" y="372" class="b">observe（默认）</text>
  <text x="280" y="396" class="s">只评估、记录 would accept</text>
  <path class="line" id="p2" d="M474 380 H 504" marker-end="url(#a)"/>
  <rect class="box" x="506" y="344" width="190" height="72" rx="6"/>
  <text x="522" y="372" class="b">团队审查记录</text>
  <text x="522" y="396" class="s">检查误触发与漏触发</text>
  <path class="line" id="p3" d="M696 380 H 726" marker-end="url(#a)"/>
  <rect x="728" y="344" width="200" height="72" rx="6" fill="#151517" stroke="#8fe3b8"/>
  <text x="744" y="372" class="b" style="fill:#8fe3b8">auto</text>
  <text x="744" y="396" class="s">再选择开启自动接受</text>

  <text x="32" y="452" class="s">显式请求在任何模式下都能执行；自主程度随证据增加，而不是一次性开放。</text>
  <text x="32" y="480" class="xs">依据 dsh-superagent-prototype 的 000-philosophy、002-authorization、007-architecture 文档整理。</text>
  <g class="motion">
    <rect x="32" y="96" width="160" height="104" rx="6" fill="none" stroke="#8fe3b8" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.03;0.045;0.115;0.13;1"/></rect>
    <rect x="212" y="96" width="170" height="104" rx="6" fill="none" stroke="#8fe3b8" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.11;0.125;0.195;0.21;1"/></rect>
    <rect x="402" y="96" width="170" height="104" rx="6" fill="none" stroke="#8fe3b8" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.19;0.205;0.275;0.29;1"/></rect>
    <rect x="592" y="96" width="160" height="104" rx="6" fill="none" stroke="#8fe3b8" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.27;0.285;0.355;0.37;1"/></rect>
    <circle r="3.4" fill="#ff6b6b" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.52;0.72;1"><mpath href="#inject"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.52;0.524;0.72;0.732;1"/></circle>
    <rect x="592" y="96" width="160" height="104" rx="6" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.72;0.735;0.845;0.86;1"/></rect>
    <text x="688" y="228" font-size="12" font-weight="600" style="fill:#ff8a80" opacity="0">✕ 拦截<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.72;0.735;0.885;0.9;1"/></text>
    <rect x="32" y="344" width="200" height="72" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.04;0.055;0.105;0.12;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.12;0.16;1"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.12;0.124;0.16;0.172;1"/></circle>
    <rect x="264" y="344" width="210" height="72" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.16;0.175;0.485;0.5;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.54;1"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.504;0.54;0.552;1"/></circle>
    <rect x="506" y="344" width="190" height="72" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.54;0.555;0.645;0.66;1"/></rect>
    <circle r="3" fill="#8fe3b8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.66;0.7;1"><mpath href="#p3"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.66;0.664;0.7;0.712;1"/></circle>
    <rect x="728" y="344" width="200" height="72" rx="6" fill="none" stroke="#8fe3b8" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7;0.715;0.905;0.92;1"/></rect>
  </g>
</svg>
