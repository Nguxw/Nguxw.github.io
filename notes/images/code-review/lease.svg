<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">租约过期之后的旧写入</title>
  <desc id="d">Worker A 取得租约后暂停，未能续租；租约过期，Worker B 接管并写入进度；A 恢复后提交暂停前算出的旧结果。存储在写回时比较执行资格，拒绝较旧的 token，A 随即停止推进。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b9994"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff5a1f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8fe3b8"/></marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 16px; font-weight: 600; }
    .box { fill: #151517; stroke: #ffffff2e; }
    .line { stroke: #9b9994; stroke-width: 1.4; fill: none; }
    @keyframes dash9 { to { stroke-dashoffset: -18; } }
    .flow9 { animation: dash9 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .flow9 { animation: none; } }
  </style>
  <rect width="960" height="540" fill="#0e0e10"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.3</text>
  <text x="84" y="40" class="s">锁过期不会终止旧的执行者</text>
  <text x="32" y="135" class="b">Worker A</text>
  <text x="32" y="255" class="b">任务存储</text>
  <text x="32" y="276" class="xs">租约与进度</text>
  <text x="32" y="375" class="b">Worker B</text>
  <path class="line" d="M150 130 H 250 M720 130 H 928" style="stroke:#ffffff2e"/>
  <path class="flow9" d="M250 130 H 720" stroke="#ffb547" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <path class="line" d="M150 250 H 928" style="stroke:#ffffff2e"/>
  <path class="line" d="M150 370 H 928" style="stroke:#ffffff2e"/>
  <path id="e1" class="line" d="M200 134 V 244" marker-end="url(#a)"/>
  <text x="170" y="112" class="s">取得租约</text>
  <text x="390" y="112" class="s" style="fill:#ffb547">暂停，未能续租</text>
  <circle cx="400" cy="250" r="5" fill="#ffb547"/>
  <text x="412" y="240" class="s" style="fill:#ffb547">租约过期</text>
  <path id="e2" class="line" d="M500 366 V 256" marker-end="url(#a)"/>
  <text x="468" y="398" class="s">接管任务</text>
  <path id="e3" d="M590 366 V 256" stroke="#8fe3b8" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="566" y="398" class="s" style="fill:#8fe3b8">写入进度，已接受</text>
  <path id="e4" d="M720 134 V 234" stroke="#ff5a1f" stroke-width="1.4" fill="none" marker-end="url(#ao)"/>
  <text x="640" y="112" class="s" style="fill:#ff5a1f">恢复后提交暂停前的旧结果</text>
  <circle cx="720" cy="250" r="11" fill="#151517" stroke="#ff6b6b" stroke-width="1.4"/>
  <path d="M715 245 l10 10 M725 245 l-10 10" stroke="#ff6b6b" stroke-width="1.6"/>
  <text x="740" y="240" class="s" style="fill:#ff6b6b">7 小于 8，拒绝写入</text>
  <text x="760" y="154" class="s">写入被拒后停止推进</text>
  <text x="212" y="274" class="xs mono">A · token 7</text>
  <text x="604" y="274" class="xs mono">B · token 8</text>
  <path d="M32 426 H 928" stroke="#ffffff1a"/>
  <text x="32" y="456" class="s">互斥只在租约有效期内成立；写回进度时需要比较执行资格，条件更新失败之后不能继续推进。</text>
  <text x="32" y="480" class="s">已经发出的外部动作不会随写入被拒而撤销，要靠幂等标识和结果查询另行处理。</text>
  <text x="32" y="514" class="xs">教学用的时序示意，不对应任何具体系统的实现。</text>
  <g class="motion">
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.11;1"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.04;0.044;0.11;0.122;1"/></circle>
    <circle cx="400" cy="250" r="12" fill="none" stroke="#ffb547" stroke-width="1.4" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2;0.215;0.285;0.3;1"/></circle>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.32;0.39;1"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.324;0.39;0.402;1"/></circle>
    <circle r="3.2" fill="#8fe3b8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.45;0.52;1"><mpath href="#e3"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.45;0.454;0.52;0.532;1"/></circle>
    <circle r="3.2" fill="#ff5a1f" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.68;1"><mpath href="#e4"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.604;0.68;0.692;1"/></circle>
    <circle cx="720" cy="250" r="22" fill="#ff6b6b" filter="url(#halo)" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.6;0.6;0;0" keyTimes="0;0.68;0.695;0.825;0.84;1"/></circle>
    <circle cx="720" cy="250" r="16" fill="none" stroke="#ff6b6b" stroke-width="1.4" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.68;0.695;0.825;0.84;1"/></circle>
  </g>
</svg>
