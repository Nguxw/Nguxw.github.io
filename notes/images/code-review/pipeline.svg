<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">一次改动经过的检查</title>
  <desc id="d">改动在提交前先由 Agent 自行验证并由新上下文的第二个 Agent 审查；每个 PR 经过必需 CI、AI 审查与安全审查；随后按风险等级决定人工批准数，进入合并队列，经功能开关与分阶段发布上线；线上事故和回滚被整理为评测集，每日检验审查器，并沉淀为规则。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b9994"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff5a1f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8fe3b8"/></marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 16px; font-weight: 600; }
    .box { fill: #151517; stroke: #ffffff2e; }
    .line { stroke: #9b9994; stroke-width: 1.4; fill: none; }
    @keyframes dash9 { to { stroke-dashoffset: -18; } }
    .flow9 { animation: dash9 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .flow9 { animation: none; } }
  </style>
  <rect width="960" height="540" fill="#0e0e10"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.1</text>
  <text x="84" y="40" class="s">一次改动在合并前后经过的检查</text>
  <text x="32" y="98" class="xs mono" letter-spacing="1">提交前与每个 PR</text>
  <text x="32" y="258" class="xs mono" letter-spacing="1">批准、合并与发布</text>
  <text x="32" y="432" class="xs mono" letter-spacing="1">反馈</text>
  <rect class="box" x="32" y="112" width="200" height="64" rx="6"/>
  <text x="48" y="140" class="b">提交前验证</text>
  <text x="48" y="162" class="s">测试 · 构建 · lint · 截图</text>
  <rect class="box" x="264" y="112" width="200" height="64" rx="6"/>
  <text x="280" y="140" class="b">新上下文审查</text>
  <text x="280" y="162" class="s">第二个 Agent 读 diff</text>
  <rect class="box" x="496" y="112" width="200" height="64" rx="6"/>
  <text x="512" y="140" class="b">必需 CI</text>
  <text x="512" y="162" class="s">lint · 类型 · 全平台测试</text>
  <rect class="box" x="728" y="112" width="200" height="64" rx="6"/>
  <text x="744" y="140" class="b">AI 审查与安全审查</text>
  <text x="744" y="162" class="s">每条发现都须答复</text>
  <rect class="box" x="32" y="272" width="200" height="64" rx="6" style="stroke:#8fe3b899"/>
  <text x="48" y="300" class="b">按风险批准</text>
  <text x="48" y="322" class="s">0 · 1 · 2 位审查者</text>
  <rect class="box" x="264" y="272" width="200" height="64" rx="6"/>
  <text x="280" y="300" class="b">合并队列</text>
  <text x="280" y="322" class="s">基于最新 main 重跑检查</text>
  <rect class="box" x="496" y="272" width="200" height="64" rx="6"/>
  <text x="512" y="300" class="b">开关与分阶段发布</text>
  <text x="512" y="322" class="s">内部先用，逐步放量</text>
  <rect class="box" x="728" y="272" width="200" height="64" rx="6"/>
  <text x="744" y="300" class="b">监测与回滚</text>
  <text x="744" y="322" class="s">向前修复或关闭开关</text>
  <rect class="box" x="496" y="396" width="200" height="64" rx="6" style="stroke:#ff5a1f88"/>
  <text x="512" y="424" class="b">事故成为评测集</text>
  <text x="512" y="446" class="s">每日检验审查器</text>
  <rect class="box" x="264" y="396" width="200" height="64" rx="6" style="stroke:#ff5a1f88"/>
  <text x="280" y="424" class="b">规则沉淀</text>
  <text x="280" y="446" class="s">CLAUDE.md · Skill · 新检查</text>
  <path id="a1" class="line" d="M232 144 H 260" marker-end="url(#a)"/>
  <path id="b1" class="line" d="M232 304 H 260" marker-end="url(#a)"/>
  <path id="a2" class="line" d="M464 144 H 492" marker-end="url(#a)"/>
  <path id="b2" class="line" d="M464 304 H 492" marker-end="url(#a)"/>
  <path id="a3" class="line" d="M696 144 H 724" marker-end="url(#a)"/>
  <path id="b3" class="line" d="M696 304 H 724" marker-end="url(#a)"/>
  <path id="c" class="line" d="M828 176 V 224 H 180 V 268" marker-end="url(#a)"/>
  <path id="f1" class="flow9" d="M828 336 V 428 H 700" stroke="#ff5a1f" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ao)"/>
  <path id="f2" class="flow9" d="M496 428 H 468" stroke="#ff5a1f" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ao)"/>
  <text x="32" y="496" class="s">风险等级由改动本身决定；Agent 的批准不计入人工批准；一次批准只对应一个提交。</text>
  <text x="32" y="520" class="xs">依据原文整理，各层的内部实现并未公开。</text>
  <g class="motion">
    <rect x="32" y="112" width="200" height="64" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.02;0.035;0.065;0.08;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.08;0.11;1"><mpath href="#a1"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.08;0.084;0.11;0.122;1"/></circle>
    <rect x="264" y="112" width="200" height="64" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.11;0.125;0.155;0.17;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.17;0.2;1"><mpath href="#a2"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.17;0.174;0.2;0.212;1"/></circle>
    <rect x="496" y="112" width="200" height="64" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2;0.215;0.245;0.26;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.26;0.29;1"><mpath href="#a3"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.26;0.264;0.29;0.302;1"/></circle>
    <rect x="728" y="112" width="200" height="64" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.29;0.305;0.335;0.35;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.35;0.41;1"><mpath href="#c"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.35;0.354;0.41;0.422;1"/></circle>
    <rect x="32" y="272" width="200" height="64" rx="6" fill="none" stroke="#8fe3b8" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.41;0.425;0.455;0.47;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.47;0.5;1"><mpath href="#b1"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.47;0.474;0.5;0.512;1"/></circle>
    <rect x="264" y="272" width="200" height="64" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.515;0.545;0.56;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.56;0.59;1"><mpath href="#b2"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.56;0.564;0.59;0.602;1"/></circle>
    <rect x="496" y="272" width="200" height="64" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.59;0.605;0.635;0.65;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.65;0.68;1"><mpath href="#b3"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.65;0.654;0.68;0.692;1"/></circle>
    <rect x="728" y="272" width="200" height="64" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.68;0.695;0.725;0.74;1"/></rect>
    <circle r="3.2" fill="#ff5a1f" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.74;0.8;1"><mpath href="#f1"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.74;0.744;0.8;0.812;1"/></circle>
    <rect x="496" y="396" width="200" height="64" rx="6" fill="none" stroke="#ff5a1f" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8;0.815;0.845;0.86;1"/></rect>
    <circle r="3.2" fill="#ff5a1f" opacity="0" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.86;0.89;1"><mpath href="#f2"/></animateMotion><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.86;0.864;0.89;0.902;1"/></circle>
    <rect x="264" y="396" width="200" height="64" rx="6" fill="none" stroke="#ff5a1f" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.89;0.905;0.945;0.96;1"/></rect>
