<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">审查循环的收敛</title>
  <desc id="d">作者 Agent 与审查 Agent 之间的往返如果没有约束，可能持续几十轮；团队加入三轮上限、只审增量、按类别报告、不重复已发布的发现和夜间扫描之后，一轮通过的比例从 65% 升至 78%，需要五轮以上的比例从 8.9% 降至 1.5%，平均轮数从 2.08 降至 1.32。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b9994"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff5a1f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8fe3b8"/></marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 16px; font-weight: 600; }
    .box { fill: #151517; stroke: #ffffff2e; }
    .line { stroke: #9b9994; stroke-width: 1.4; fill: none; }
    @keyframes dash9 { to { stroke-dashoffset: -18; } }
    .flow9 { animation: dash9 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .flow9 { animation: none; } }
  </style>
  <rect width="960" height="560" fill="#0e0e10"/>
  <rect width="960" height="560" fill="url(#grid)"/>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.2</text>
  <text x="84" y="40" class="s">审查循环需要能够结束</text>
  <text x="32" y="84" class="xs mono" letter-spacing="1">未加约束的往返</text>
  <rect class="box" x="32" y="100" width="176" height="64" rx="6"/>
  <text x="48" y="128" class="b">作者 Agent</text>
  <text x="48" y="150" class="s">修复并推送</text>
  <rect class="box" x="276" y="100" width="176" height="64" rx="6"/>
  <text x="292" y="128" class="b">审查 Agent</text>
  <text x="292" y="150" class="s">再次审查</text>
  <path id="l1" class="line" d="M208 120 H 272" marker-end="url(#a)"/>
  <path id="l2" class="line" d="M276 144 H 212" marker-end="url(#a)"/>
  <text x="32" y="198" class="s">一个 CLI 的 PR 曾在一夜之间往返五十多轮。</text>
  <text x="32" y="222" class="s">反复被标出的代码，约 59% 在首轮审查时就已存在。</text>
  <text x="32" y="262" class="xs mono" letter-spacing="1">轮次</text>
  <circle cx="44" cy="286" r="7" fill="#151517" stroke="#8fe3b8"/>
  <circle cx="70" cy="286" r="7" fill="#151517" stroke="#8fe3b8"/>
  <circle cx="96" cy="286" r="7" fill="#151517" stroke="#8fe3b8"/>
  <circle cx="122" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="148" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="174" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="200" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="226" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="252" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="278" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="304" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="330" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="356" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <circle cx="382" cy="286" r="7" fill="#151517" stroke="#ffffff2e"/>
  <path d="M109 270 V 302" stroke="#ff5a1f" stroke-width="1.4"/>
  <text x="118" y="318" class="s" style="fill:#ff5a1f">三轮上限：请作者重新考虑方案</text>
  <text x="508" y="84" class="xs mono" letter-spacing="1">收敛措施</text>
  <rect class="box" x="508" y="100" width="420" height="34" rx="6"/>
  <text x="524" y="122" font-size="14">三轮之后不再继续，交回作者重新考虑方案</text>
  <rect class="box" x="508" y="144" width="420" height="34" rx="6"/>
  <text x="524" y="166" font-size="14">前几轮之后只审查新增的 diff</text>
  <rect class="box" x="508" y="188" width="420" height="34" rx="6"/>
  <text x="524" y="210" font-size="14">按类别报告缺陷，同类问题一次修完</text>
  <rect class="box" x="508" y="232" width="420" height="34" rx="6"/>
  <text x="524" y="254" font-size="14">已经发布过的发现不再重复提出</text>
  <rect class="box" x="508" y="276" width="420" height="34" rx="6"/>
  <text x="524" y="298" font-size="14">既有代码交给夜间运行的审查 Agent</text>
  <path d="M32 348 H 928" stroke="#ffffff1a"/>
  <text x="32" y="378" class="xs mono" letter-spacing="1">措施前后（原文数据）</text>
  <text x="32" y="408" font-size="14">一轮审查与修复后通过</text>
  <rect x="32" y="424" width="143" height="14" rx="3" fill="#6b6a66"/>
  <text x="183" y="436" class="s mono">65%</text>
  <rect x="32" y="450" width="171.6" height="14" rx="3" fill="#8fe3b8"/>
  <text x="211.6" y="462" class="s mono" style="fill:#8fe3b8">78%</text>
  <text x="340" y="408" font-size="14">需要五轮及以上</text>
  <rect x="340" y="424" width="195.8" height="14" rx="3" fill="#6b6a66"/>
  <text x="543.8" y="436" class="s mono">8.9%</text>
  <rect x="340" y="450" width="33" height="14" rx="3" fill="#8fe3b8"/>
  <text x="381" y="462" class="s mono" style="fill:#8fe3b8">1.5%</text>
  <text x="648" y="408" font-size="14">通过所需的平均审查次数</text>
  <rect x="648" y="424" width="183.04" height="14" rx="3" fill="#6b6a66"/>
  <text x="839.04" y="436" class="s mono">2.08</text>
  <rect x="648" y="450" width="116.16" height="14" rx="3" fill="#8fe3b8"/>
  <text x="772.16" y="462" class="s mono" style="fill:#8fe3b8">1.32</text>
  <rect x="32" y="494" width="12" height="12" rx="2" fill="#6b6a66"/><text x="52" y="505" class="s">措施前</text>
  <rect x="112" y="494" width="12" height="12" rx="2" fill="#8fe3b8"/><text x="132" y="505" class="s">措施后</text>
  <text x="32" y="536" class="xs">三组数据的量纲不同，条形长度只在各组内部可比。</text>
  <g class="motion">
    <circle r="3" fill="#edece8" filter="url(#glow)"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#l1"/></animateMotion><animate attributeName="opacity" dur="1.6s" begin="0s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.52;1"/></circle>
    <circle r="3" fill="#edece8" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#l2"/></animateMotion><animate attributeName="opacity" dur="1.6s" begin="0.8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.52;1"/></circle>
    <circle cx="44" cy="286" r="7" fill="#8fe3b8" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.06;0.075;0.885;0.9;1"/></circle>
    <circle cx="70" cy="286" r="7" fill="#8fe3b8" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2;0.215;0.885;0.9;1"/></circle>
    <circle cx="96" cy="286" r="7" fill="#8fe3b8" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.355;0.885;0.9;1"/></circle>
    <rect x="508" y="100" width="420" height="34" rx="6" fill="none" stroke="#ff5a1f" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.515;0.885;0.9;1"/></rect>
  </g>
</svg>
