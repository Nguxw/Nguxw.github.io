<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">主动服务的筛选漏斗示意</title>
  <desc id="d">大量事件先经过去重与低成本筛选，再判断是否影响既有目标；结果分为不处理、稍后合并、准备草稿、询问用户和授权范围内执行，只有少数会打扰用户。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff0d"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b9994"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff5a1f"/></marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; fill: #edece8; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #9b9994; }
    .xs { font-size: 12px; fill: #6b6a66; }
    .b { font-size: 16px; font-weight: 600; }
    .box { fill: #151517; stroke: #ffffff2e; }
    .line { stroke: #9b9994; stroke-width: 1.4; fill: none; }
    @keyframes dash9 { to { stroke-dashoffset: -18; } }
    .flow9 { animation: dash9 1.2s linear infinite; }
    .rm-only { display: none; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .flow9 { animation: none; } .rm-only { display: inline; } }
  </style>
  <rect width="960" height="540" fill="#0e0e10"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <g class="motion"><rect x="660" y="254" width="268" height="40" rx="8" fill="#ff5a1f" filter="url(#halo)" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.5;0.5;0;0" keyTimes="0;0.66;0.675;0.845;0.86;1"/></rect><rect x="640" y="372" width="288" height="96" rx="6" fill="#ffb547" filter="url(#halo)" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.18;0.18;0;0" keyTimes="0;0.1;0.115;0.285;0.3;1"/></rect></g>
  <text x="32" y="40" class="mono" font-size="12" fill="#ff5a1f" letter-spacing="1.5">FIG.2</text>
  <text x="84" y="40" class="s">主动服务要决定做什么、何时做，以及何时保持安静</text>

  <text x="32" y="96" class="xs mono" letter-spacing="1">事件流</text>
  <rect x="32" y="110" width="124" height="30" rx="15" fill="#151517" stroke="#ffffff2e"/><text x="94" y="130" text-anchor="middle" class="s">新邮件</text>
  <path id="e0" class="line" d="M156 125 C 182 125, 180 220, 200 220" marker-end="url(#a)"/>
  <rect x="32" y="150" width="124" height="30" rx="15" fill="#151517" stroke="#ffffff2e"/><text x="94" y="170" text-anchor="middle" class="s">文件变化</text>
  <path id="e1" class="line" d="M156 165 C 182 165, 180 220, 200 220" marker-end="url(#a)"/>
  <rect x="32" y="190" width="124" height="30" rx="15" fill="#151517" stroke="#ffffff2e"/><text x="94" y="210" text-anchor="middle" class="s">日程变更</text>
  <path id="e2" class="line" d="M156 205 C 182 205, 180 220, 200 220" marker-end="url(#a)"/>
  <rect x="32" y="230" width="124" height="30" rx="15" fill="#151517" stroke="#ffffff2e"/><text x="94" y="250" text-anchor="middle" class="s">新论文</text>
  <path id="e3" class="line" d="M156 245 C 182 245, 180 220, 200 220" marker-end="url(#a)"/>
  <rect x="32" y="270" width="124" height="30" rx="15" fill="#151517" stroke="#ffffff2e"/><text x="94" y="290" text-anchor="middle" class="s">群聊消息</text>
  <path id="e4" class="line" d="M156 285 C 182 285, 180 220, 200 220" marker-end="url(#a)"/>
  <rect x="32" y="310" width="124" height="30" rx="15" fill="#151517" stroke="#ffffff2e"/><text x="94" y="330" text-anchor="middle" class="s">账户动态</text>
  <path id="e5" class="line" d="M156 325 C 182 325, 180 220, 200 220" marker-end="url(#a)"/>

  <rect class="box" x="204" y="170" width="170" height="100" rx="6"/>
  <text x="220" y="202" class="b">去重与筛选</text>
  <text x="220" y="228" class="s">规则与增量比对</text>
  <text x="220" y="250" class="s">低成本模型初筛</text>
  <path id="s12" class="line" d="M374 220 H 416" marker-end="url(#a)"/>
  <rect class="box" x="420" y="170" width="180" height="100" rx="6"/>
  <text x="436" y="202" class="b">影响既有目标吗</text>
  <text x="436" y="228" class="s">与哪项事务有关</text>
  <text x="436" y="250" class="s">改变了哪个判断</text>
  <text x="660" y="96" class="xs mono" letter-spacing="1">可选的输出</text>
  <rect class="box" x="660" y="110" width="268" height="40" rx="6"/>
  <text x="676" y="135" font-size="14" font-weight="600">不处理</text>
  <path id="o0" class="line" d="M600 220 C 630 220, 630 130, 656 130" marker-end="url(#a)"/>
  <rect class="box" x="660" y="158" width="268" height="40" rx="6"/>
  <text x="676" y="183" font-size="14" font-weight="600">留待之后合并</text>
  <path id="o1" class="line" d="M600 220 C 630 220, 630 178, 656 178" marker-end="url(#a)"/>
  <rect class="box" x="660" y="206" width="268" height="40" rx="6"/>
  <text x="676" y="231" font-size="14" font-weight="600">准备草稿</text>
  <path id="o2" class="line" d="M600 220 C 630 220, 630 226, 656 226" marker-end="url(#a)"/>
  <rect class="box" x="660" y="254" width="268" height="40" rx="6" style="stroke:#ff5a1f"/>
  <text x="676" y="279" font-size="14" font-weight="600">询问用户</text>
  <text x="912" y="279" text-anchor="end" class="xs">附上依据与已准备的工作</text>
  <path id="o3" class="line" d="M600 220 C 630 220, 630 274, 656 274" marker-end="url(#a)"/>
  <rect class="box" x="660" y="302" width="268" height="40" rx="6"/>
  <text x="676" y="327" font-size="14" font-weight="600">在授权范围内执行</text>
  <path id="o4" class="line" d="M600 220 C 630 220, 630 322, 656 322" marker-end="url(#a)"/>

  <rect class="box" x="32" y="372" width="568" height="96" rx="6"/>
  <text x="48" y="400" class="b">一次有价值的介入</text>
  <text x="48" y="426" class="s">新论文反驳了文稿第三节的判断：已定位段落、整理依据、准备修改。</text>
  <text x="48" y="450" class="s">需要用户决定的，只是是否接受这项结论变化。</text>
  <rect class="box" x="640" y="372" width="288" height="96" rx="6"/>
  <text x="656" y="400" class="b">两种预算</text>
  <text x="656" y="426" class="s">计算：观察频率与检查成本</text>
  <text x="656" y="450" class="s">注意力：没有新证据，就不再打扰</text>
  <text x="32" y="512" class="xs">示意图。</text>
  <g class="motion">
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.08;1"><mpath href="#e0"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.02;0.024;0.08;0.092;1"/></circle>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.06;0.12;1"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.06;0.064;0.12;0.132;1"/></circle>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.16;1"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.104;0.16;0.172;1"/></circle>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.14;0.2;1"><mpath href="#e3"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.14;0.144;0.2;0.212;1"/></circle>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.18;0.24;1"><mpath href="#e4"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.18;0.184;0.24;0.252;1"/></circle>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.22;0.28;1"><mpath href="#e5"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.22;0.224;0.28;0.292;1"/></circle>
    <rect x="204" y="170" width="170" height="100" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.08;0.095;0.305;0.32;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.32;0.37;1"><mpath href="#s12"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.324;0.37;0.382;1"/></circle>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4;0.45;1"><mpath href="#s12"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.404;0.45;0.462;1"/></circle>
    <rect x="420" y="170" width="180" height="100" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.37;0.385;0.505;0.52;1"/></rect>
    <circle r="3" fill="#edece8" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.56;1"><mpath href="#o1"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.504;0.56;0.572;1"/></circle>
    <rect x="660" y="158" width="268" height="40" rx="6" fill="none" stroke="#edece8" stroke-width="1.2" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.56;0.575;0.625;0.64;1"/></rect>
    <circle r="3.6" fill="#ff5a1f" opacity="0" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.66;1"><mpath href="#o3"/></animateMotion><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.604;0.66;0.672;1"/></circle>
    <rect x="32" y="372" width="568" height="96" rx="6" fill="none" stroke="#ff5a1f" stroke-width="1.6" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7;0.715;0.905;0.92;1"/></rect>
  </g>
</svg>
